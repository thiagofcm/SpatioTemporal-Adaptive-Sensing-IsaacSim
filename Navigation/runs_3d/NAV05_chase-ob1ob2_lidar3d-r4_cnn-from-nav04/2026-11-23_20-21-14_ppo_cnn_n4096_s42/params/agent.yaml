seed: 42
device: cuda:0
num_steps_per_env: 32
max_iterations: 1500
empirical_normalization: {}
obs_groups:
  actor:
  - lidar
  - policy
  critic:
  - lidar
  - policy
clip_actions: 1.0
check_for_nan: true
save_interval: 100
experiment_name: stnav_tb4_corridor_lidar3d
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
actor:
  class_name: st_nav.rl.lidar_cnn:LidarCNNModel
  hidden_dims:
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0
    std_type: scalar
  cnn_cfg:
    output_channels:
    - 16
    - 32
    - 64
    kernel_size: 3
    stride: 2
    dilation: 1
    padding: none
    norm: none
    activation: relu
    max_pool: false
    global_pool: none
    flatten: true
  projection_dim: 128
  projection_activation: relu
critic:
  class_name: st_nav.rl.lidar_cnn:LidarCNNModel
  hidden_dims:
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg: null
  cnn_cfg:
    output_channels:
    - 16
    - 32
    - 64
    kernel_size: 3
    stride: 2
    dilation: 1
    padding: none
    norm: none
    activation: relu
    max_pool: false
    global_pool: none
    flatten: true
  projection_dim: 128
  projection_activation: relu
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0003
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.005
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg: null
policy: {}
