# NAV02_chase-ob1_dr: PPO navigation in the dynamic corridor with OB1 only moving (milestone M6), TurtleBot4 + 40-beam 2D LiDAR.
# Reference equivalent: ST04_chase-ob1_dr (adaptive_sensor_policy, corridor_dynamic_chase_random, obstacles: [1]).
# Card: Navigation/eval/NAV02_chase-ob1_dr/README.md
#
# Every key overrides a field of the configclasses registered with `task` (env: CorridorNavEnvCfg,
# agent: CorridorNavPPORunnerCfg); values equal to the defaults are listed on purpose (they pin the experiment).
# Observation, reward, actuator model, LiDAR and control rate are those of NAV01_static_initial.
# Train:  bin/isaacrun -g <gpu> -- python Navigation/scripts/train.py --headless --config Navigation/configs/NAV02_chase-ob1_dr.yaml
exp_id: NAV02_chase-ob1_dr
task: STNav-TB4-Corridor-v0
run_name: null                      # default: ppo_n<num_envs>_s<seed>

env:
  scene.num_envs: 4096
  episode_length_s: 70.0            # 350 control steps (5 Hz), as the reference training (max_episode_steps 350)
  # ---- scene: corridor without Z1-Z4, moving obstacles OB1 / OB2 (random_ping_pong) ----
  scene_name: corridor_dynamic_chase_random
  active_obstacles: [1]
  # ---- domain randomization (reference flag names; ST04 / ST05 settings) ----
  obstacle_presence_dr: false       # fixed set above in every episode
  obstacle_speed_dr: true           # speed ~ U(0.04, 0.08) m/s per obstacle and episode
  obstacle_y_dr: true               # path y: OB1 ~ U[1.20, 1.70], OB2 ~ U[0.60, 1.10], gap y1 - y2 in [0.55, 0.65] m
  obstacle_radius_dr: false         # radius 0.17 m (radius DR not supported)
  start_pose_dr: true               # 5 reference start points, yaw pi +- 10 deg
  goals: [[-1.80, -1.70], [-2.00, -1.80], [-2.00, -2.00], [-2.20, -1.70], [-1.80, -2.10], [-2.20, -2.10]]   # reference ST04/ST05 list
  lidar_noise: true
  # ---- sensing (independent of control) ----
  lidar_period_s: 0.2
  # ---- observation / terminations (as NAV01) ----
  goal_distance_norm: 7.0
  goal_tolerance: 0.20
  safety_margin: 0.05
  # ---- reward (as NAV01) ----
  rewards.progress_scale: 10.0
  rewards.proximity_scale: 1.0
  rewards.proximity_clearance: 0.15
  rewards.time_penalty_per_s: 0.1
  rewards.goal_reward: 30.0
  rewards.collision_penalty: 30.0
  rewards.timeout_penalty: 0.0

agent:                              # as NAV01
  seed: 42
  max_iterations: 1500
  num_steps_per_env: 32
  algorithm.learning_rate: 3.0e-4
  algorithm.gamma: 0.99
  algorithm.lam: 0.95
  algorithm.entropy_coef: 0.005

sweep: {}                           # reserved, e.g. {agent.seed: [42, 43, 44]}
