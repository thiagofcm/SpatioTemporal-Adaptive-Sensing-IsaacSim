# NAV05_chase-ob1ob2_lidar3d-r4_cnn-from-nav04: PPO with the CNN on the fixed 3D LiDAR in the dynamic corridor with
# OB1 + OB2 moving (the NAV03 task), warm-started from the NAV04 static-scene policy (model_499: 97 % on ref_static_c10).
#
# Task: as NAV03_chase-ob1ob2_dr (scene, moving obstacles and their DR, start poses, goals, rewards, terminations).
# Sensor and network: as NAV04_static_lidar3d-r4_cnn (Mirrorcle raster approximation, R4 mount (0, 0, 0.40) m, pitch
# 6.75 deg; FoV 28 x 14 deg, 139 x 34 rays, 12 m, 1 cm noise, 4 Hz; CNN 16/32/64 -> 128 + 7 features -> MLP 256-128).
# Initialization: actor and critic weights of NAV04 model_499 (incl. observation normalizer and action std); fresh
# optimizer, iteration 0, learning rate 3e-4 (adaptive). Same network, so the checkpoint loads strictly.
# The NAV03 2D-LiDAR period (lidar_period_s 0.2) does not apply: the 3D sensor runs at lidar3d.period_s (4 Hz).
#
# Values equal to the defaults are listed on purpose: they pin the experiment.
# Train:  bin/isaacrun -g <gpu> -- python Navigation/scripts/train_3d.py --headless --config Navigation/configs_3d/NAV05_chase-ob1ob2_lidar3d-r4_cnn-from-nav04.yaml
exp_id: NAV05_chase-ob1ob2_lidar3d-r4_cnn-from-nav04
task: STNav-TB4-Corridor-Lidar3D-v0
run_name: null                      # default: ppo_cnn_n<num_envs>_s<seed>

init_from:
  checkpoint: Navigation/runs_3d/NAV04_static_lidar3d-r4_cnn/2026-11-23_16-56-10_ppo_cnn_n4096_s42/model_499.pt
  mode: weights                     # warm start (weights only); resume = also optimizer, iteration, learning rate

env:
  scene.num_envs: 4096
  episode_length_s: 70.0            # 350 control steps (5 Hz)
  # ---- scene: corridor without Z1-Z4, moving obstacles OB1 / OB2 (random_ping_pong), as NAV03 ----
  scene_name: corridor_dynamic_chase_random
  active_obstacles: [1, 2]
  wall_height: 0.6
  baffle_height: 0.6
  obstacle_height: 0.5
  # ---- domain randomization (as NAV03) ----
  obstacle_presence_dr: false       # fixed set above in every episode
  obstacle_speed_dr: true           # speed ~ U(0.04, 0.08) m/s per obstacle and episode
  obstacle_y_dr: true               # path y: OB1 ~ U[1.20, 1.70], OB2 ~ U[0.60, 1.10], gap y1 - y2 in [0.55, 0.65] m
  obstacle_radius_dr: false         # radius 0.17 m
  start_pose_dr: true               # 5 reference start points, yaw pi +- 10 deg
  goals: [[-1.80, -1.70], [-2.00, -1.80], [-2.00, -2.00], [-2.20, -1.70], [-1.80, -2.10], [-2.20, -2.10]]   # reference ST04/ST05 list
  lidar_noise: true                 # 3D: Gaussian range noise (lidar3d.noise_type / noise_sigma)
  # ---- sensor: 3D LiDAR, R4 mount (as NAV04) ----
  sensor: lidar3d
  obs_layout: image
  lidar3d.mount_pos: [0.0, 0.0, 0.40]
  lidar3d.mount_rpy_deg: [0.0, 6.75, 0.0]
  lidar3d.h_fov_deg: [-14.0, 14.0]
  lidar3d.v_fov_deg: [-7.0, 7.0]
  lidar3d.cols: 139
  lidar3d.rows: 34
  lidar3d.placement: cell_center
  lidar3d.ray_order: row_major_top_left
  lidar3d.range_max: 12.0
  lidar3d.noise_type: gaussian
  lidar3d.noise_sigma: 0.01
  lidar3d.period_s: 0.25
  lidar3d.include_floor: true
  # ---- observation / terminations (as NAV01 / NAV03 / NAV04) ----
  goal_distance_norm: 7.0
  goal_tolerance: 0.20
  safety_margin: 0.05
  # ---- reward (as NAV01 / NAV03 / NAV04) ----
  rewards.progress_scale: 10.0
  rewards.proximity_scale: 1.0
  rewards.proximity_clearance: 0.15
  rewards.time_penalty_per_s: 0.1
  rewards.goal_reward: 30.0
  rewards.collision_penalty: 30.0
  rewards.timeout_penalty: 0.0

agent:                              # PPO as NAV03 / NAV04
  seed: 42
  max_iterations: 1500              # as NAV03 (from scratch); a warm start may need fewer
  num_steps_per_env: 32
  algorithm.learning_rate: 3.0e-4
  algorithm.gamma: 0.99
  algorithm.lam: 0.95
  algorithm.entropy_coef: 0.005

sweep: {}
